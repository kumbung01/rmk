[keyboard]
name = "rmk-custom-split"
product_name = "rmk-custom-split"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "nrf52840"
usb_enable = true

[rmk]
split_peripherals_num = 1

[event.sleep_state]
subs = 3

# nRF52840 DK central and one nice!nano peripheral.
# Direct-pin buttons are active low.
[layout]
rows = 2
cols = 4
map = """
(0,0) (0,1) (0,2) (0,3)
(1,0) (1,1) (1,2) (1,3)

"""

[keymap]
layers = 1

[[keymap.layer]]
keys = """
1 2 3 4
F13 6 7 8

"""

[ble]
enabled = false

[split]
connection = "custom"

[split.central]
rows = 1
cols = 4
row_offset = 0
col_offset = 0

[split.central.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [["P0_11", "P0_12", "P0_24", "P0_25"]]

[[split.peripheral]]
rows = 1
cols = 4
row_offset = 1
col_offset = 0

[split.peripheral.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [["P0_06", "P0_08", "P0_17", "P0_20"]]

[storage]
enabled = false

[host]
vial_enabled = false
rynk_enabled = false


[event.keyboard]
subs = 4

[event.pointing]
subs = 3
